name: wellknown-sync

on:
  push:
    paths:
      - "skills/**"
      - ".well-known/**"
      - "scripts/check_wellknown_sync.py"
      - ".github/workflows/wellknown-sync.yml"

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify well-known tree mirrors canonical skill
        run: python3 scripts/check_wellknown_sync.py
